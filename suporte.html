<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="suporte.css">
    <title>Suporte</title>
</head>
<body>

    <header>
        <div class="volta-dois">
        <a href="" onclick="history.back(); return false;">
            <img src="voltar-azul-btn.png" id="voltar">
        </a>
            <img src="tres-pontos-azul-btn.png" id="tres-pontos" alt="Opções">
        </div>
    </header>

    <div class="conteudo">
        <div class="container-principal">
            <img src="logo-suporte.png" id="logo" alt="Logo">
            <h1>SUPORTE</h1>
        </div>
    </div>

    <div class="main-container">
        <div class="img-su">
            <img src="suporte-img.png" id="suporte-img" alt="Suporte">
        </div>
        
        <div class="container-caixa">
            <textarea id="dois" name="text" placeholder="Fala que eu te escuto..."></textarea>
            <button id="botao" type="submit">Enviar</button>
        </div>
    </div>

</body>
</html>
