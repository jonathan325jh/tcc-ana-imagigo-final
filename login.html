<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css?v=1.0">
    <title>Tela de login</title>
    <style>
        #mensagem-erro {
            color: red;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>
    <a href="home.html">Voltar</a>
    <div>
        <h1>Login</h1>

        <p id="mensagem-erro"></p>

        <form id="login-form">
            <input type="text" id="email" placeholder="Email" required>
            <br><br>
            <input type="password" id="senha" placeholder="Senha" required>
            <br><br>
            <input class="inputSubmit" type="submit" value="Enviar">
        </form>
    </div>

    <!-- Script oficial do SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://yxsfpmqwhpvajzyrapyi.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4c2ZwbXF3aHB2YWp6eXJhcHlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4OTU0MDAsImV4cCI6MjEwMzQ3MTQwMH0.qNgFa9lbwdqEjVFM2Su4yHchR_vtl7w9QOOrPYe1wsA";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('login-form');
        const erroBox = document.getElementById('mensagem-erro');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            
            erroBox.style.display = 'none';
            
            const emailDigitado = document.getElementById('email').value;
            const senhaDigitada = document.getElementById('senha').value;

            try {
                // Consulta a tabela 'usuarios' procurando pelo email e pela senha informados
                const { data: usuarios, error } = await supabaseClient
                    .from('usuarios')
                    .select('*')
                    .eq('email', emailDigitado)
                    .eq('senha', senhaDigitada);

                if (error) {
                    throw new Error(error.message);
                }

                if (usuarios && usuarios.length > 0) {
                    const usuario = usuarios[0];

                    // Salva os dados na sessão do navegador
                    localStorage.setItem('usuario_nome', usuario.nome || '');
                    localStorage.setItem('usuario_email', usuario.email);

                    // Redireciona imediatamente para a página de entrada
                    window.location.href = 'pagina-entrada.html';
                } else {
                    erroBox.innerText = "E-mail ou senha incorretos!";
                    erroBox.style.display = 'block';
                }

            } catch (erro) {
                console.error("Erro na autenticação:", erro);
                erroBox.innerText = `Erro ao conectar: ${erro.message}`;
                erroBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
