                            C 138,72 125,60 100,60 Z" />

        <div class="coluna-formulario">

                        <div class="perfil-texto">
                            <h1 id="usuario-nome">Carregando...</h1>
                            <p id="usuario-level">Level 0</p>
                            
                            <div class="container-barra-xp">
                                <div class="barra-xp-fundo">
                                    <div class="barra-xp-progresso" id="barra-progresso" style="width: 0%;"></div>
                                </div>
                                <span class="texto-xp" id="texto-xp">0 / 100 XP</span>
                            </div>

                    <div class="baixo">
                        <h2>Insígnias</h2>
                        <div class="circulos">
                            <svg width="65" height="65" viewBox="0 0 100 100" id="insignia-verde" class="insignia-bloqueada">
                                <circle cx="50" cy="50" r="40" stroke="#ccc" stroke-width="4" fill="none"/>
                            </svg>
                            <svg width="65" height="65" viewBox="0 0 100 100" id="insignia-laranja" class="insignia-bloqueada">
                                <circle cx="50" cy="50" r="40" stroke="#ccc" stroke-width="4" fill="none"/>
                            </svg>
                            <svg width="65" height="65" viewBox="0 0 100 100" id="insignia-azul" class="insignia-bloqueada">

    <div class="botoes-pao">
        <a href="tutoriais.html" id="tutoriais">Tutoriais</a>

        <a href="" id="gestao">Gestão</a>
    </div>

    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://yxsfpmqwhpvajzyrapyi.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4c2ZwbXF3aHB2YWp6eXJhcHlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4OTU0MDAsImV4cCI6MjEwMzQ3MTQwMH0.qNgFa9lbwdqEjVFM2Su4yHchR_vtl7w9QOOrPYe1wsA";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 1. Verifica autenticação via localStorage
        const emailSalvo = localStorage.getItem('usuario_email');

        if (!emailSalvo) {
            window.location.href = 'login.html';
        }

        // 2. Carrega dados do perfil e atualiza a interface
        async function carregarDadosCriar() {
            try {
                const { data: usuarios, error } = await supabaseClient
                    .from('usuarios')
                    .select('nome, level, xp')
                    .eq('email', emailSalvo);

                if (error) throw error;

                if (usuarios && usuarios.length > 0) {
                    const usuario = usuarios[0];
                    const nomeUsuario = usuario.nome || 'Usuário';
                    const level = Number(usuario.level) || 0;
                    const xp = Number(usuario.xp) || 0;

                    // Cálculo da barra de XP
                    const xpAtualNoNivel = xp % 100;
                    const xpParaProximoNivel = 100;
                    const porcentagemXp = Math.min(100, Math.max(0, (xpAtualNoNivel / xpParaProximoNivel) * 100));

                    // Atualiza textos e progresso
                    document.getElementById('usuario-nome').innerText = nomeUsuario;
                    document.getElementById('usuario-level').innerText = `Level ${level}`;
                    document.getElementById('barra-progresso').style.width = `${porcentagemXp}%`;
                    document.getElementById('texto-xp').innerText = `${xpAtualNoNivel} / ${xpParaProximoNivel} XP`;

                    // Atualiza estado visual das insígnias
                    atualizarInsignia('insignia-verde', level >= 100, '#2ecc71', '#2ecc7122');
                    atualizarInsignia('insignia-laranja', level >= 300, '#e67e22', '#e67e2222');
                    atualizarInsignia('insignia-azul', level >= 500, '#3498db', '#3498db22');
                    atualizarInsignia('insignia-rosa', level >= 900, '#e91e63', '#e91e6322');
                } else {
                    localStorage.clear();
                    window.location.href = 'login.html';
                }
            } catch (erro) {
                console.error("Erro ao carregar dados de criação:", erro);
            }
        }

        // Helper para estilizar os círculos das insígnias
        function atualizarInsignia(id, ativa, corStroke, corFill) {
            const svg = document.getElementById(id);
            const circle = svg.querySelector('circle');

            if (ativa) {
                svg.className.baseVal = 'insignia-ativa';
                circle.setAttribute('stroke', corStroke);
                circle.setAttribute('fill', corFill);
            } else {
                svg.className.baseVal = 'insignia-bloqueada';
                circle.setAttribute('stroke', '#ccc');
                circle.setAttribute('fill', 'none');
            }
        }

        carregarDadosCriar();
    </script>

</body>
</html>
