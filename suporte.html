<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="suporte.css">
    <title>Suporte</title>
</head>
<body>

    <header>
        <div class="volta-dois">
            <a href="" onclick="history.back(); return false;">
                <img src="voltar-azul-btn.png" id="voltar" alt="Voltar">
            </a>
            <img src="tres-pontos-azul-btn.png" id="tres-pontos" alt="Opções">
        </div>
    </header>

    <div class="conteudo">
        <div class="container-principal">
            <img src="logo-suporte.png" id="logo" alt="Logo">
            <h1>SUPORTE</h1>
        </div>
    </div>

    <div class="main-container">
        <div class="img-su">
            <img src="suporte-img.png" id="suporte-img" alt="Suporte">
        </div>
        
        <form class="container-caixa" id="formSuporte">
            <textarea id="dois" name="text" placeholder="Fala que eu te escuto..." required></textarea>
            <button id="botao" type="submit">Enviar</button>
        </form>
    </div>

    <!-- Biblioteca Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Biblioteca Oficial do EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <script type="text/javascript">
        // 1. Configuração do Supabase
        const SUPABASE_URL = "https://yxsfpmqwhpvajzyrapyi.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4c2ZwbXF3aHB2YWp6eXJhcHlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4OTU0MDAsImV4cCI6MjEwMzQ3MTQwMH0.qNgFa9lbwdqEjVFM2Su4yHchR_vtl7w9QOOrPYe1wsA";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. Configuração do EmailJS
        emailjs.init("63uV71CQvOzLY4tM9");

        document.getElementById('formSuporte').addEventListener('submit', async function(event) {
            event.preventDefault();

            const btn = document.getElementById('botao');
            const mensagemTexto = document.getElementById('dois').value.trim();
            
            // Tenta resgatar o e-mail logado no navegador; caso esteja em outro PC sem login, registra a identificação padrão
            const emailUsuario = localStorage.getItem('usuario_email') || sessionStorage.getItem('usuario_email') || 'Não informado (outro PC)';

            if (!mensagemTexto) {
                alert('Por favor, digite uma mensagem antes de enviar.');
                return;
            }

            btn.innerText = 'Enviando...';
            btn.disabled = true;

            try {
                // Passo 1: Gravar no Supabase (Banco de Dados)
                const { error: supabaseError } = await supabaseClient
                    .from('feedbacks')
                    .insert([
                        { 
                            usuario_email: emailUsuario, 
                            mensagem: mensagemTexto 
                        }
                    ]);

                if (supabaseError) {
                    console.warn("Aviso ao salvar no Supabase:", supabaseError.message);
                }

                // Passo 2: Disparar E-mail via EmailJS
                const templateParams = {
                    usuario_email: emailUsuario,
                    email: emailUsuario,
                    from_name: emailUsuario,
                    message: mensagemTexto,
                    mensagem: mensagemTexto
                };

                await emailjs.send('service_fmvpcip', 'template_kllil48', templateParams);

                alert('Mensagem enviada com sucesso!');
                document.getElementById('dois').value = '';

            } catch (error) {
                console.error('Erro na gravação ou envio:', error);
                alert('Sua mensagem foi gravada no banco de dados, mas houve uma oscilação no envio do e-mail.');
            } finally {
                btn.innerText = 'Enviar';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
